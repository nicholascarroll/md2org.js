name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test

  # Rebuilds and asserts the tree is unchanged, so the generated copies cannot
  # depend on anything outside src/.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      - name: derived copies are current
        run: |
          node build.js
          git diff --exit-code || {
            echo "::error::run 'node build.js' and commit the result"; exit 1; }

      - name: forked parser regenerates identically
        run: |
          node tools/build-vendor.js
          git diff --exit-code || {
            echo "::error::a patch in tools/build-vendor.js no longer applies"; exit 1; }

  # test/emacs.js is the only export check. `npm test` skips it when Emacs is
  # absent, so this job installs Emacs to run it.
  emacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends emacs-nox
      - run: emacs --version | head -1
      - run: npm ci
      - run: node test/emacs.js
